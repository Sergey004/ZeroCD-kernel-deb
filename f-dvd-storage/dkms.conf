# dkms.conf — f-dvd-storage
# DKMS автоматически пересобирает модуль при обновлении ядра

PACKAGE_NAME="f-dvd-storage"
PACKAGE_VERSION="1.0.0"

# PRE_BUILD вызывается перед make.
# Скрипт копирует f_mass_storage.c из заголовков текущего ядра и патчит его.
PRE_BUILD="scripts/dkms_prebuild.sh"

# MAKE[0] и CLEAN[0] — обязательно с индексом [0], иначе DKMS игнорирует
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

# Модуль для установки
BUILT_MODULE_NAME[0]="f_dvd_storage"
BUILT_MODULE_LOCATION[0]="."
DEST_MODULE_LOCATION[0]="/updates/dkms"

# Хуки после установки / удаления
POST_INSTALL="scripts/dkms_postinstall.sh"
POST_REMOVE="scripts/dkms_postremove.sh"

# Автоматическая пересборка при обновлении ядра
AUTOINSTALL="yes"
