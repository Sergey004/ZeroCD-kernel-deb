name: Build f-dvd-storage DKMS

on:
  # 1. Автоматически после успешного build-kernel.yml (тот же репо)
  workflow_run:
    workflows: ["Build ZeroCD Kernel"]
    types: [completed]
    branches: [master]

  # 2. При изменении исходников самого пакета
  push:
    branches: [master]
    paths:
      - 'f-dvd-storage/**'

  # 3. Ручной запуск
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if sources unchanged'
        required: false
        default: false
        type: boolean

env:
  PKG_NAME: f-dvd-storage
  PKG_VERSION: "1.0.0"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: Решаем — нужна ли пересборка
  # ───────────────────────────────────────────────────────────────────────────
  check:
    name: Check if rebuild needed
    runs-on: ubuntu-24.04
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      skip:       ${{ steps.decide.outputs.skip }}
      src_hash:   ${{ steps.hash.outputs.value }}
      kernel_ver: ${{ steps.kver.outputs.value }}

    steps:
      - name: Checkout master (source)
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout gh-pages (APT repo)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: apt-repo
          sparse-checkout: |
            .last_dkms_sha
          sparse-checkout-cone-mode: false

      - name: Compute source hash
        id: hash
        run: |
          HASH=$(find src/f-dvd-storage -type f | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          echo "value=$HASH" >> $GITHUB_OUTPUT
          echo "Hash: $HASH"

      - name: Decide skip
        id: decide
        run: |
          FORCE="${{ inputs.force_rebuild }}"
          if [ -f apt-repo/.last_dkms_sha ]; then
            LAST=$(cat apt-repo/.last_dkms_sha)
            if [ "$LAST" = "${{ steps.hash.outputs.value }}" ] && [ "$FORCE" != "true" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "✅ Source unchanged ($LAST), skipping DKMS build."
            else
              echo "skip=false" >> $GITHUB_OUTPUT
              echo "🔄 Source changed or force-rebuild. Proceeding."
            fi
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "🆕 First DKMS build."
          fi

      - name: Get latest kernel version from APT pool
        id: kver
        run: |
          HDR=$(find apt-repo/pool/main \
                  -name "linux-headers-*-zerocd*_arm64.deb" \
                  ! -name "*zerocd_1.0*" \
                2>/dev/null | sort -V | tail -1)
          if [ -z "$HDR" ]; then
            echo "value=unknown" >> $GITHUB_OUTPUT
            echo "⚠️  No kernel headers in pool yet."
          else
            VER=$(dpkg-deb -f "$HDR" Version)
            echo "value=$VER" >> $GITHUB_OUTPUT
            echo "✅ Kernel headers version: $VER"
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: Сборка
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build DKMS .deb
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Checkout gh-pages (APT repo)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: apt-repo

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            debhelper dkms dpkg-dev apt-utils gnupg devscripts \
            python3 build-essential

      # ── Ставим kernel headers из нашего же pool ───────────────────────────
      - name: Install ZeroCD kernel headers from pool
        run: |
          POOL="$(pwd)/apt-repo/pool/main"
          HDR=$(find "$POOL" \
                  -name "linux-headers-*-zerocd*_arm64.deb" \
                  ! -name "*zerocd_1.0*" \
                2>/dev/null | sort -V | tail -1)

          if [ -n "$HDR" ]; then
            echo "📦 Installing: $(basename $HDR)"
            sudo dpkg -i "$HDR" || sudo apt-get -f install -y
          else
            echo "⚠️  ZeroCD headers not found, falling back to raspberrypi-kernel-headers"
            sudo apt-get install -y raspberrypi-kernel-headers
          fi

          echo "Installed headers:"
          dpkg -l | grep linux-headers | tail -5

      # ── Собрать .deb ───────────────────────────────────────────────────────
      - name: Build f-dvd-storage-dkms .deb
        run: |
          set -e
          cd repo/f-dvd-storage

          # Architecture: all — НЕ используем -a флаг
          dpkg-buildpackage -us -uc -b

          # .deb выходит на уровень выше (рядом с f-dvd-storage/)
          cd ..
          DEB=$(find . -maxdepth 1 -name "f-dvd-storage-dkms_*.deb" | head -1)
          if [ -z "$DEB" ]; then
            echo "❌ .deb not found after build!"
            find . -maxdepth 2 -name "*.deb"
            exit 1
          fi
          echo "✅ Built: $(basename $DEB)"
          mkdir -p ../debs
          mv "$DEB" ../debs/

      - name: Show package info
        run: |
          DEB=$(find debs -name "*.deb" | head -1)
          echo "=== Control ===" && dpkg-deb -f "$DEB"
          echo ""
          echo "=== Contents ===" && dpkg-deb -c "$DEB" | head -50

      # ── Добавить в APT пул ─────────────────────────────────────────────────
      - name: Add .deb to APT pool
        run: |
          mkdir -p apt-repo/pool/main
          find apt-repo/pool/main -name "f-dvd-storage-dkms_*.deb" -delete || true
          cp debs/*.deb apt-repo/pool/main/
          echo "Pool contents:"
          ls -lh apt-repo/pool/main/

      - name: Regenerate Packages index
        run: |
          cd apt-repo
          mkdir -p dists/stable/main/binary-arm64
          dpkg-scanpackages --arch arm64 pool/main /dev/null \
            > dists/stable/main/binary-arm64/Packages
          gzip -9c dists/stable/main/binary-arm64/Packages \
            > dists/stable/main/binary-arm64/Packages.gz
          echo "Packages in index:"
          grep "^Package:" dists/stable/main/binary-arm64/Packages

      - name: Regenerate Release file
        run: |
          cd apt-repo/dists/stable
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="ZeroCD Kernel" \
            -o APT::FTPArchive::Release::Label="zerocd-kernel" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o APT::FTPArchive::Release::Architectures="arm64" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Description="ZeroCD Custom Raspberry Pi Kernel" \
            release . > Release

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          FP=$(gpg --list-secret-keys --with-colons | grep '^fpr' | head -1 | cut -d: -f10)
          [ -z "$FP" ] && echo "❌ GPG key not found!" && exit 1
          echo "GPG_FP=$FP" >> $GITHUB_ENV
          echo "✅ GPG: ${FP:0:16}..."

      - name: Sign Release
        run: |
          cd apt-repo/dists/stable
          gpg --batch --yes \
              --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
              --pinentry-mode loopback \
              --default-key "$GPG_FP" \
              --clearsign -o InRelease Release
          gpg --batch --yes \
              --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
              --pinentry-mode loopback \
              --default-key "$GPG_FP" \
              --detach-sign --armor -o Release.gpg Release
          echo "✅ Release signed"

      - name: Export public GPG key
        run: |
          gpg --armor --export "$GPG_FP" > apt-repo/zerocd-kernel.gpg.key

      - name: Save source hash
        run: |
          echo "${{ needs.check.outputs.src_hash }}" > apt-repo/.last_dkms_sha

      - name: Commit and push to gh-pages
        run: |
          cd apt-repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "dkms: f-dvd-storage ${{ env.PKG_VERSION }} for kernel ${{ needs.check.outputs.kernel_ver }}

          Built by: ${{ github.workflow }} #${{ github.run_number }}
          Trigger:  ${{ github.event_name }}
          Commit:   ${{ github.sha }}"
          git push origin gh-pages

      - name: Job summary
        run: |
          DEB=$(find debs -name "*.deb" | head -1)
          VER=$(dpkg-deb -f "$DEB" Version)
          {
            echo "## ✅ f-dvd-storage DKMS built"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Package | \`$(basename $DEB)\` |"
            echo "| Version | \`$VER\` |"
            echo "| For kernel | \`${{ needs.check.outputs.kernel_ver }}\` |"
            echo "| Trigger | ${{ github.event_name }} |"
            echo ""
            echo "### Install on Pi:"
            echo '```bash'
            echo 'sudo apt install f-dvd-storage-dkms'
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
