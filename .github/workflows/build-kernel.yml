name: Build ZeroCD Kernel

on:
  schedule:
    - cron: '0 3 * * *'      # Каждый день в 3:00 UTC
  workflow_dispatch:           # Ручной запуск
  push:
    paths:
      - 'patches/**.patch'    # При изменении патчей

jobs:
  check:
    name: Check upstream for changes
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.upstream.outputs.sha }}
      sha_short: ${{ steps.upstream.outputs.sha_short }}
      skip: ${{ steps.check.outputs.skip }}

    steps:
      - name: Get latest commit from raspberrypi/linux
        id: upstream
        run: |
          SHA=$(git ls-remote https://github.com/raspberrypi/linux refs/heads/rpi-6.12.y | cut -f1)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "sha_short=${SHA:0:8}" >> $GITHUB_OUTPUT

      - name: Checkout gh-pages (APT repo)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: apt-repo
          sparse-checkout: |
            .last_built_sha
          sparse-checkout-cone-mode: false

      - name: Check if this SHA was already built
        id: check
        run: |
          if [ -f apt-repo/.last_built_sha ]; then
            LAST=$(cat apt-repo/.last_built_sha)
            if [ "$LAST" = "${{ steps.upstream.outputs.sha }}" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "✅ Upstream не изменился ($LAST), пропускаем сборку."
            else
              echo "skip=false" >> $GITHUB_OUTPUT
              echo "🔄 Новый коммит: ${{ steps.upstream.outputs.sha }}"
            fi
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "🆕 Первая сборка."
          fi

  build:
    name: Build kernel
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write

    steps:
      - name: Checkout Repo B (patches)
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Checkout gh-pages (APT repo)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: apt-repo

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex \
            libssl-dev libelf-dev \
            build-essential \
            debhelper \
            dpkg-dev apt-utils gnupg \
            make rsync

      - name: Clone raspberrypi/linux (rpi-6.12.y)
        run: |
          git clone --depth=1 \
            -b rpi-6.12.y \
            https://github.com/raspberrypi/linux \
            kernel-src
          echo "✅ Клонировано: $(git -C kernel-src log --oneline -1)"

      - name: Apply patches
        run: |
          cd kernel-src
          PATCHES=$(ls ../repo/patches/00-*.patch 2>/dev/null || true)
          if [ -z "$PATCHES" ]; then
            echo "⚠️  Патчей не найдено в patches/00-*.patch — сборка без патчей"
          else
            for patch in ../repo/patches/00-*.patch; do
              echo "▶ Applying: $(basename $patch)"
              git apply --reject --whitespace=fix "$patch"
            done
            echo "✅ Все патчи применены"
          fi

      - name: Build kernel (bcm2711_defconfig, bindeb-pkg)
        run: |
          cd kernel-src

          make bcm2711_defconfig

          make \
            KERNEL=kernel8 \
            LOCALVERSION=-zerocd+ \
            -j$(nproc) \
            bindeb-pkg

          echo "✅ Сборка завершена"

      - name: Build meta package (linux-image-zerocd)
        run: |
          KVER=$(ls debs/linux-image-*.deb | sed -E 's/.*linux-image-([0-9\.\-v8\+a-zA-Z0-9]+)_arm64.deb/\1/')

          mkdir -p meta/DEBIAN
          cat > meta/DEBIAN/control <<EOF
          Package: linux-image-zerocd
          Version: 1.0
          Section: kernel
          Priority: optional
          Architecture: arm64
          Maintainer: Sergey004
          Depends: linux-image-$KVER
          Description: ZeroCD kernel meta package
            This package always depends on the latest ZeroCD kernel.
          EOF

          dpkg-deb --build meta linux-image-zerocd_1.0_arm64.deb
          mv linux-image-zerocd_1.0_arm64.deb debs/

      - name: Build meta package (linux-headers-zerocd)
        run: |
          KVER=$(ls debs/linux-headers-*.deb | sed -E 's/.*linux-headers-([0-9\.\-v8\+a-zA-Z0-9]+)_arm64.deb/\1/')

          mkdir -p meta2/DEBIAN
          cat > meta2/DEBIAN/control <<EOF
          Package: linux-headers-zerocd
          Version: 1.0
          Section: kernel
          Priority: optional
          Architecture: arm64
          Maintainer: Sergey004
          Depends: linux-headers-$KVER
          Description: ZeroCD kernel headers meta package
            This package always depends on the latest ZeroCD kernel headers.
          EOF

        dpkg-deb --build meta2 linux-headers-zerocd_1.0_arm64.deb
        mv linux-headers-zerocd_1.0_arm64.deb debs/

      - name: Collect .deb packages
        run: |
          mkdir -p debs
          # bindeb-pkg кладёт .deb в родительскую папку (рядом с kernel-src)
          mv *.deb debs/ 2>/dev/null || true
          echo "📦 Собранные пакеты:"
          ls -lh debs/

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          FP=$(gpg --list-secret-keys --with-colons | grep '^fpr' | head -1 | cut -d: -f10)
          echo "GPG_FP=$FP" >> $GITHUB_ENV

      - name: Add .deb packages to APT repo pool
        run: |
          mkdir -p apt-repo/pool/main
          cp debs/*.deb apt-repo/pool/main/

      - name: Generate Packages index
        run: |
          cd apt-repo
          mkdir -p dists/stable/main/binary-arm64

          dpkg-scanpackages --arch arm64 pool/main /dev/null \
            > dists/stable/main/binary-arm64/Packages

          gzip -9c dists/stable/main/binary-arm64/Packages \
            > dists/stable/main/binary-arm64/Packages.gz

          echo "✅ Packages index создан"

      - name: Generate Release file
        run: |
          cd apt-repo/dists/stable

          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="ZeroCD Kernel" \
            -o APT::FTPArchive::Release::Label="zerocd-kernel" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o APT::FTPArchive::Release::Architectures="arm64" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Description="ZeroCD Custom Raspberry Pi Kernel" \
            release . > Release

          echo "✅ Release файл создан"

      - name: Sign Release with GPG
        run: |
          cd apt-repo/dists/stable

          # InRelease — inline подпись (современный способ)
          gpg --batch --yes \
              --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
              --pinentry-mode loopback \
              --default-key "$GPG_FP" \
              --clearsign \
              -o InRelease Release

          # Release.gpg — detached подпись (для старых apt)
          gpg --batch --yes \
              --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
              --pinentry-mode loopback \
              --default-key "$GPG_FP" \
              --detach-sign --armor \
              -o Release.gpg Release

          echo "✅ Release подписан"

      - name: Export public GPG key
        run: |
          gpg --armor --export "$GPG_FP" \
            > apt-repo/zerocd-kernel.gpg.key

      - name: Save built SHA
        run: |
          echo "${{ needs.check.outputs.sha }}" > apt-repo/.last_built_sha

      - name: Commit and push APT repo
        run: |
          cd apt-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "kernel: rpi-6.12.y@${{ needs.check.outputs.sha_short }}"
          git push

      - name: Summary
        run: |
          echo "## ✅ Сборка завершена" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Upstream SHA | \`${{ needs.check.outputs.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Ветка | rpi-6.12.y |" >> $GITHUB_STEP_SUMMARY
          echo "| defconfig | bcm2711_defconfig |" >> $GITHUB_STEP_SUMMARY
          echo "| LOCALVERSION | v8-zerocd+ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Пакеты:" >> $GITHUB_STEP_SUMMARY
          ls debs/*.deb | xargs -I{} basename {} | sed 's/^/- `/' | sed 's/$/`/' >> $GITHUB_STEP_SUMMARY
