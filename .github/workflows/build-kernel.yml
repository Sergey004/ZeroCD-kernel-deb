name: Build ZeroCD Kernel

on:
  schedule:
    - cron: '0 3 * * *'      # Daily at 3:00 UTC
  workflow_dispatch:           # Manual trigger
  push:
    paths:
      - 'patches/**.patch'    # Trigger on patch changes

jobs:
  check:
    name: Check upstream for changes
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.upstream.outputs.sha }}
      sha_short: ${{ steps.upstream.outputs.sha_short }}
      skip: ${{ steps.check.outputs.skip }}

    steps:
      - name: Get latest commit from raspberrypi/linux
        id: upstream
        run: |
          set -e
          SHA=$(git ls-remote https://github.com/raspberrypi/linux refs/heads/rpi-6.12.y | cut -f1)
          if [ -z "$SHA" ]; then
            echo "❌ Error: failed to get SHA from repository!"
            exit 1
          fi
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "sha_short=${SHA:0:8}" >> $GITHUB_OUTPUT

      - name: Checkout gh-pages (APT repo)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: apt-repo
          sparse-checkout: |
            .last_built_sha
          sparse-checkout-cone-mode: false

      - name: Check if this SHA was already built
        id: check
        run: |
          set -e
          if [ -f apt-repo/.last_built_sha ]; then
            LAST=$(cat apt-repo/.last_built_sha)
            if [ "$LAST" = "${{ steps.upstream.outputs.sha }}" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "✅ Upstream unchanged ($LAST), skipping build."
            else
              echo "skip=false" >> $GITHUB_OUTPUT
              echo "🔄 New commit: ${{ steps.upstream.outputs.sha }}"
            fi
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "🆕 First build."
          fi

  build:
    name: Build kernel
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write

    steps:
      - name: Checkout Repo B (patches)
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Checkout gh-pages (APT repo)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: apt-repo

      - name: Install build dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex \
            libssl-dev libelf-dev \
            build-essential \
            debhelper \
            dpkg-dev apt-utils gnupg \
            make rsync

      - name: Clone raspberrypi/linux (rpi-6.12.y)
        run: |
          set -e
          git clone --depth=1 \
            -b rpi-6.12.y \
            https://github.com/raspberrypi/linux \
            kernel-src
          cd kernel-src
          git fetch --depth=100 origin c1924e0
          git checkout c1924e0
          echo "✅ Checked out commit: $(git log --oneline -1)"

      - name: Apply patches
        run: |
          set -e
          cd kernel-src
          PATCHES=$(ls ../repo/patches/00-*.patch 2>/dev/null || true)
          if [ -z "$PATCHES" ]; then
            echo "⚠️  No patches found in patches/00-*.patch - building without patches"
          else
            for patch in ../repo/patches/00-*.patch; do
              echo "▶ Applying: $(basename $patch)"
              git apply --reject --whitespace=fix "$patch"
            done
            echo "✅ All patches applied"
          fi

      - name: Build kernel (bcm2711_defconfig, bindeb-pkg)
        run: |
          set -e
          cd kernel-src

          make bcm2711_defconfig

          make \
            KERNEL=kernel8 \
            LOCALVERSION=-zerocd+ \
            -j4 \
            bindeb-pkg

          echo "✅ Build completed"

      - name: Collect .deb packages
        run: |
          set -e
          mkdir -p debs
          
          # Safe search and mv .deb files
          find . -maxdepth 2 -type f -name "*.deb" -not -path "./debs/*" -exec mv {} debs/ \;
          
          # Verify that packages were found
          if [ -z "$(find debs -maxdepth 1 -name "*.deb")" ]; then
            echo "❌ Error: .deb packages not found!"
            exit 1
          fi
          
          echo "📦 Built packages:"
          ls -lh debs/

      - name: Build meta package (linux-image-zerocd)
        run: |
          set -e
          # Find file using find (to avoid ls failures in CI)
          PKG_FILE=$(find debs -maxdepth 1 -name "linux-image-*.deb" | head -n 1)
          
          if [ -z "$PKG_FILE" ]; then
            echo "❌ Error: linux-image package not found!"
            exit 1
          fi
          
          # Get package name and version
          REAL_PKG_NAME=$(dpkg-deb -f "$PKG_FILE" Package)
          PKG_VERSION=$(dpkg-deb -f "$PKG_FILE" Version)
          echo "✅ Dependency: $REAL_PKG_NAME (= $PKG_VERSION)"
          echo "📋 Package file: $PKG_FILE"
          echo "📋 Full package info:"
          dpkg-deb -f "$PKG_FILE"

          mkdir -p meta/DEBIAN
          
          # Create postinst script to install kernel to boot firmware
          cat > meta/DEBIAN/postinst <<'POSTINST_EOF'
          #!/bin/bash
          set -e
          
          # Find latest installed ZeroCD kernel
          KERNEL=$(ls -t /boot/vmlinuz-*-zerocd* 2>/dev/null | head -n 1)
          INITRD=$(ls -t /boot/initrd.img-*-zerocd* 2>/dev/null | head -n 1)
          
          if [ -z "$KERNEL" ] || [ -z "$INITRD" ]; then
            echo "⚠️  ZeroCD kernel not found in /boot, skipping firmware installation"
            exit 0
          fi
          
          # Create firmware directory if it doesn't exist
          mkdir -p /boot/firmware
          
          # Copy kernel and initrd
          cp "$KERNEL" /boot/firmware/kernel8.img
          cp "$INITRD" /boot/firmware/initramfs8
          
          echo "✅ Kernel installed to /boot/firmware:"
          echo "   kernel8.img: $KERNEL"
          echo "   initramfs8: $INITRD"
          echo "📋 Please reboot to apply the new kernel."
          POSTINST_EOF
          chmod 755 meta/DEBIAN/postinst
          
          cat > meta/DEBIAN/control <<EOF
          Package: linux-image-zerocd
          Version: 1.0
          Section: kernel
          Priority: optional
          Architecture: arm64
          Maintainer: Sergey004
          Depends: $REAL_PKG_NAME (>= $PKG_VERSION)
          Description: ZeroCD kernel meta package
            This package always depends on the latest ZeroCD kernel.
            Automatically installs kernel to /boot/firmware on Raspberry Pi.
          EOF
          
          echo "📋 Generated control file:"
          cat meta/DEBIAN/control

          dpkg-deb --build meta linux-image-zerocd_1.0_arm64.deb
          mv linux-image-zerocd_1.0_arm64.deb debs/

      - name: Build meta package (linux-headers-zerocd)
        run: |
          set -e
          PKG_FILE=$(find debs -maxdepth 1 -name "linux-headers-*.deb" | head -n 1)
          
          if [ -z "$PKG_FILE" ]; then
            echo "❌ Error: linux-headers package not found!"
            exit 1
          fi
          
          # Get package name and version
          REAL_PKG_NAME=$(dpkg-deb -f "$PKG_FILE" Package)
          PKG_VERSION=$(dpkg-deb -f "$PKG_FILE" Version)
          echo "✅ Dependency: $REAL_PKG_NAME (= $PKG_VERSION)"
          echo "📋 Package file: $PKG_FILE"
          echo "📋 Full package info:"
          dpkg-deb -f "$PKG_FILE"

          mkdir -p meta2/DEBIAN
          cat > meta2/DEBIAN/control <<EOF
          Package: linux-headers-zerocd
          Version: 1.0
          Section: kernel
          Priority: optional
          Architecture: arm64
          Maintainer: Sergey004
          Depends: $REAL_PKG_NAME (>= $PKG_VERSION)
          Description: ZeroCD kernel headers meta package
            This package always depends on the latest ZeroCD kernel headers.
          EOF

          echo "📋 Generated control file:"
          cat meta2/DEBIAN/control

          dpkg-deb --build meta2 linux-headers-zerocd_1.0_arm64.deb
          mv linux-headers-zerocd_1.0_arm64.deb debs/

      - name: Import GPG key
        run: |
          set -e
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          FP=$(gpg --list-secret-keys --with-colons | grep '^fpr' | head -1 | cut -d: -f10)
          if [ -z "$FP" ]; then
            echo "❌ Error: GPG key not found!"
            exit 1
          fi
          echo "GPG_FP=$FP" >> $GITHUB_ENV

      - name: Add .deb packages to APT repo pool
        run: |
          set -e
          mkdir -p apt-repo/pool/main
          cp debs/*.deb apt-repo/pool/main/

      - name: Generate Packages index
        run: |
          set -e
          cd apt-repo
          mkdir -p dists/stable/main/binary-arm64

          dpkg-scanpackages --arch arm64 pool/main /dev/null \
            > dists/stable/main/binary-arm64/Packages

          gzip -9c dists/stable/main/binary-arm64/Packages \
            > dists/stable/main/binary-arm64/Packages.gz

          echo "✅ Packages index generated"

      - name: Generate Release file
        run: |
          set -e
          cd apt-repo/dists/stable

          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="ZeroCD Kernel" \
            -o APT::FTPArchive::Release::Label="zerocd-kernel" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o APT::FTPArchive::Release::Architectures="arm64" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Description="ZeroCD Custom Raspberry Pi Kernel" \
            release . > Release

          echo "✅ Release file created"

      - name: Sign Release with GPG
        run: |
          set -e
          cd apt-repo/dists/stable

          gpg --batch --yes \
              --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
              --pinentry-mode loopback \
              --default-key "$GPG_FP" \
              --clearsign \
              -o InRelease Release

          gpg --batch --yes \
              --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
              --pinentry-mode loopback \
              --default-key "$GPG_FP" \
              --detach-sign --armor \
              -o Release.gpg Release

          echo "✅ Release signed"

      - name: Export public GPG key
        run: |
          set -e
          gpg --armor --export "$GPG_FP" \
            > apt-repo/zerocd-kernel.gpg.key

      - name: Save built SHA
        run: |
          set -e
          echo "${{ needs.check.outputs.sha }}" > apt-repo/.last_built_sha

      - name: Commit and push APT repo
        run: |
          set -e
          cd apt-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          
          # Check if there are changes before commit
          if ! git diff --cached --quiet; then
            git commit -m "kernel: rpi-6.12.y@${{ needs.check.outputs.sha_short }}"
          else
            echo "⚠️  No changes to commit"
          fi
          
          # Attempt push with error checking
          if ! git push 2>&1; then
            echo "❌ Error: failed to push changes!"
            git log --oneline -1
            exit 1
          fi
          echo "✅ Changes pushed successfully"

      - name: Summary
        run: |
          set -e
          echo "## ✅ Build completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Upstream SHA | \`${{ needs.check.outputs.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | rpi-6.12.y |" >> $GITHUB_STEP_SUMMARY
          echo "| defconfig | bcm2711_defconfig |" >> $GITHUB_STEP_SUMMARY
          echo "| LOCALVERSION | -zerocd+ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages:" >> $GITHUB_STEP_SUMMARY
          ls debs/*.deb | xargs -I{} basename {} | sed 's/^/- `/' | sed 's/$/`/' >> $GITHUB_STEP_SUMMARY